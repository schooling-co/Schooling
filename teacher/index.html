// ---- login code, firebase setup wizard, storage quota
const RULES_TXT=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function mine(u) { return signedIn() && request.auth.uid == u; }
    function owner() { return signedIn() && request.auth.uid == 'PASTE_OWNER_UID_HERE'; }
    function blocked(u) {
      return exists(/databases/$(database)/documents/licenses/$(u))
        && get(/databases/$(database)/documents/licenses/$(u)).data.status in ['suspended', 'removed'];
    }
    function paid(u) {
      return exists(/databases/$(database)/documents/licenses/$(u))
        && get(/databases/$(database)/documents/licenses/$(u)).data.until > request.time.toMillis();
    }
    function trial(u) {
      return get(/databases/$(database)/documents/directory/$(u)).data.created + duration.value(3, 'd') > request.time;
    }
    // school data: only its own account, and only while paid or in trial
    match /schools/{u}/{document=**} {
      allow read, write: if owner();
      allow read, write: if mine(u) && !blocked(u) && (paid(u) || trial(u));
    }
    // school profile + payment request (school writes, cannot change 'created')
    match /directory/{u} {
      allow read: if mine(u) || owner();
      // no self-create: only the owner can add an account (owner write rule below)
      allow update: if mine(u) && request.resource.data.created == resource.data.created;
      allow write: if owner();
    }
    // licences: only the owner can write
    match /licenses/{u} {
      allow read: if mine(u) || owner();
      allow write: if owner();
    }
  }
}

 if(((S.inv&&S.inv.schools)||[]).some(s=>cc(s.code)===x))return true;

 const left=q=>{const t=q.trashedAt||0;if(!t)return null;return Math.ceil((t+DAYS*864e5-Date.now())/864e5)};
 const trashHTML=list=>{if(!list.length)return"";return `<details style="margin-top:14px" ${list.length?"open":""}><summary class="name" style="cursor:pointer">🗑 Trash (${list.length})</summary><p class="stat">Delete kiye hue school ${DAYS} din tak yahan rehte hain. Wapas la sakte hain. Login band rehta hai.</p>${list.map(r=>{const id=r.id,v=r.v,d=left(r.q),late=d!==null&&d<=0;return `<div class="osc" style="border:1px dashed var(--line);border-radius:16px;padding:10px;margin:8px 0;background:var(--card)"><b>${esc(v.name||"-")}</b><div class="stat" style="word-break:break-all">${esc(v.email||"")}</div><div class="stat" style="color:${late?"#dc2626":"#b45309"}">${d===null?"Purana delete (kitne din hue pata nahi)":late?"⏰ "+DAYS+" din poore. Ab hamesha ke liye delete kar dein.":"⏳ "+d+" din baqi"}</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px"><button class="btn" onclick="osRestore('${id}')">♻ Wapas</button><button class="ghost" onclick="osDownload('${id}')">⬇ Data</button><button class="ghost" style="color:#dc2626" onclick="osPurge('${id}')">❌ Forever</button></div></div>`}).join("")}</details>`};
window.ownerPanel=async function(){
 let g=$("gate");if(!g){gate("");g=$("gate")}
 g.innerHTML='<div class="card" style="max-width:560px;width:100%"><p>Loading...</p></div>';
 try{
  const [d,l]=await Promise.all([fbdb.collection("directory").get(),fbdb.collection("licenses").get()]);
  const L={};l.docs.forEach(x=>L[x.id]=x.data());OSD={};d.docs.forEach(x=>OSD[x.id]=x.data());
  const VV={};let vErr=false;try{const vs=await fbdb.collection("vault").get();vs.docs.forEach(x=>VV[x.id]=x.data())}catch(e){vErr=true}
  window.VAULT=VV;
  const all=d.docs.map(x=>({id:x.id,v:x.data(),q:L[x.id]||{}})).sort((a,b)=>String(a.v.name||"").localeCompare(String(b.v.name||"")));
  const rows=all.filter(r=>r.q.status!=="removed"),trash=all.filter(r=>r.q.status==="removed");
  const cnt={on:0,hold:0,other:0};rows.forEach(r=>{const k=stOf(r.q,r.v).k;if(k==="hold")cnt.hold++;else if(k==="on"||k==="trial")cnt.on++;else cnt.other++});
  const card=r=>{const id=r.id,v=r.v,q=r.q,s=stOf(q,v),held=s.k==="hold",c=VV[id]||{},
   pend=v.txn?`<div class="stat" style="color:#b45309">💳 Payment request: ${esc(v.txn)} ${esc(v.ph||"")}</div>`:"",
   cred=c.code?`<div class="stat">Login: <b>${esc(c.login||v.email||"")}</b> · Code: <span id="pw_${id}">••••••</span> <button class="ghost" onclick="vaultShow('${id}')">👁 Dekhein</button> <button class="ghost" onclick="vaultCopy('${id}')">📋 Copy</button></div>`:`<div class="stat">Login: <b>${esc(v.email||"")}</b> · <span style="color:#b45309">Code save nahi hai. ✏ Login edit se naya code dein.</span></div>`;
   return `<div class="osc" data-q="${esc((String(v.name||"")+" "+String(v.email||"")).toLowerCase())}" style="border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;background:var(--card)">
<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div style="min-width:0"><b>${esc(v.name||"-")}</b><div class="stat" style="word-break:break-all">${esc(v.email||"")}</div></div><span style="white-space:nowrap;font-weight:700;font-size:.8rem;color:${s.c}">${s.t}</span></div>
<div class="stat">Access ${q.from?dLoc(q.from)+" se ":""}${q.until?dLoc(q.until)+" tak":"set nahi"} · Joined ${dstr(v.created&&v.created.toMillis&&v.created.toMillis())}</div>${pend}
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<button class="btn" ${held?"disabled":""} style="${held?"opacity:.4":""}" onclick="osHold('${id}')">⏸ Hold</button>
<button class="btn" ${held?"":"disabled"} style="${held?"":"opacity:.4"}" onclick="osOpen('${id}')">▶ Open</button>
<button class="ghost" onclick="osDownload('${id}')">⬇ Download data</button>
<button class="ghost" style="color:#dc2626" onclick="osTrash('${id}')">🗑 Delete</button></div>
<details style="margin-top:10px"><summary class="stat" style="cursor:pointer">More: plan, login, space</summary>${cred}
<div class="stat">Access se: <input type="date" id="lf_${id}" value="${dIn(q.from)}" aria-label="Access se"> tak: <input type="date" id="lt_${id}" value="${dIn(q.until)}" aria-label="Access tak"> <button class="ghost" onclick="lcSetDates('${id}')">Dates save</button></div>
<button class="btn" onclick="lcExt('${id}',1)">+1 month</button> <button class="ghost" onclick="lcExt('${id}',-1)">−1 month</button> <button class="ghost" onclick="lcExt('${id}',12)">+12 months</button>
${v.email&&v.email.includes("@")?`<button class="ghost" onclick="lcReset('${esc(v.email)}')">Password reset email</button>`:""}
<button class="ghost" onclick="schoolForm('${id}')">✏ Login edit</button> <button class="ghost" onclick="lcQ('${id}')">Space ${q.quotaMB||BIZ.quotaMB} MB</button> <button class="ghost" onclick="supOpen('${id}')">🔎 School kholo (view)</button></details></div>`};
  g.innerHTML=`<div class="card" style="max-width:560px;width:100%;max-height:92vh;overflow:auto"><div class="name">👑 Schools: ${rows.length}</div><p class="stat">✅ Chal rahe ${cnt.on} · ⏸ Hold ${cnt.hold} · ⚠ Baqi ${cnt.other}</p>${vErr?'<p class="stat" style="color:#b45309">Login/code store (vault) could not be opened. Publish the new Firestore rules.</p>':""}<button class="btn" style="margin:6px 0" onclick="schoolForm()">➕ Add new school</button> <button class="ghost" style="margin:6px 0" onclick="logView()">📋 Login log</button><input type="search" placeholder="🔎 School ka naam ya email" aria-label="Search school" oninput="osFilter(this.value)" style="margin:6px 0;width:100%"><div id="osl">${rows.map(card).join("")||'<p class="stat">Abhi koi school nahi.</p>'}</div>${trashHTML(trash)}<button class="ghost" style="margin-top:10px" onclick="hideGate()">Close</button></div>`;
 }catch(e){g.innerHTML='<div class="card"><p>Could not load. Check the rules and owner ID.</p><button class="ghost" onclick="hideGate()">Band</button></div>'}};
async function setStatus(id,status){await fbdb.collection("licenses").doc(id).set({status,ts:Date.now()},{merge:true})}
window.osHold=async function(id){if(!isOwner())return;
 if(!confirm("'"+nm(id)+"' ko HOLD karein?\n\nSchool, teachers aur parents login nahi kar sakenge. Data safe rahega. Open dabane se sab wapas chal jaye ga."))return;
 try{await setStatus(id,"suspended");say("Hold ho gaya");ownerPanel()}catch(x){alert(fe(x))}};
window.osOpen=async function(id){if(!isOwner())return;
 try{await setStatus(id,"active");const c=await fbdb.collection("licenses").doc(id).get(),q=c.exists?c.data():{};
  if(!((q.until||0)>Date.now())){const v=OSD[id]||{},tr=v.created&&v.created.toMillis?v.created.toMillis()+BIZ.trialDays*864e5:0;if(tr<=Date.now())alert("Open ho gaya, lekin is school ke plan ki date khatam hai. More mein +1 month se barhayein.")}
  say("Open ho gaya");ownerPanel()}catch(x){alert(fe(x))}};
window.osDownload=async function(id,quiet){if(!isOwner())return null;
 try{say("Data la rahe hain...");const r=await readSet((a,x)=>cdoc(a,x),id,"");
  if(!r){if(!quiet)alert("Is school ka cloud data abhi nahi mila.");return null}
  const o=JSON.parse(r.str);if(!o||!o.S){if(!quiet)alert("School ka data parha nahi ja saka.");return null}
  const name=(o.S.settings&&o.S.settings.school)||nm(id);
  dl(fn(name)+"-backup-"+ymd()+".json",JSON.stringify(Object.assign({},o.S,{superH:undefined,_ph:o.PH||{}})));
  say("Download shuru: "+(o.S.students||[]).length+" students");return o}
 catch(x){alert("Download nahi hua: "+((x&&x.message)||x));return null}};
async function purgePhone(idx){const ents=Object.keys(idx||{}).map(k=>idx[k]).filter(e=>e&&typeof e==="object"&&typeof e.c==="string"&&e.c);
 for(let i=0;i<ents.length;i+=8){await Promise.all(ents.slice(i,i+8).map(async e=>{try{const ref=fbdb.collection("phonelogin").doc(e.c);for(let j=0;j<(e.n||0);j++)await ref.collection("c").doc(String(j)).delete().catch(()=>{});await ref.delete()}catch(x){}}))}}
window.osTrash=async function(id){if(!isOwner())return;const name=nm(id);
 if(!confirm("'"+name+"' ko DELETE karein?\n\nSchool Trash mein chala jaye ga aur login band ho jaye ga. "+DAYS+" din tak wapas la sakte hain. Data abhi nahi mitta."))return;
 try{await fbdb.collection("licenses").doc(id).set({status:"removed",trashedAt:Date.now(),ts:Date.now()},{merge:true});say("Trash mein bhej diya");ownerPanel()}catch(x){alert(fe(x))}};
window.osRestore=async function(id){if(!isOwner())return;
 if(!confirm("'"+nm(id)+"' ko wapas laayein? School dobara login kar sakega."))return;
 try{await fbdb.collection("licenses").doc(id).set({status:"active",trashedAt:0,ts:Date.now()},{merge:true});say("School wapas aa gaya");ownerPanel()}catch(x){alert(fe(x))}};
window.osPurge=async function(id){if(!isOwner())return;const name=nm(id);
 if(!confirm("HAMESHA KE LIYE DELETE: '"+name+"'\n\nYe wapas nahi aa sakta. Pehle iska backup khud download hoga.\n\nJari rakhein?"))return;
 const t=prompt("Confirm karne ke liye school ka naam likhein:\n"+name);
 if(t===null)return;if(t.trim().toLowerCase()!==String(name).trim().toLowerCase()){alert("Naam match nahi hua. Delete nahi kiya.");return}
 const o=await osDownload(id,true);
 if(!o){if(!confirm("Backup nahi ban saka (data nahi mila ya error). Phir bhi delete karein?"))return}
 else await new Promise(r=>setTimeout(r,800));
 try{
  say("Delete ho raha hai...");
  if(o&&o.S&&o.S.logidx)await purgePhone(o.S.logidx);
  try{const sh=fbdb.collection("phoneshared").doc(id),sd=await sh.get();if(sd.exists){const n=(sd.data()||{}).n||0;for(let i=0;i<n;i++)await sh.collection("c").doc(String(i)).delete().catch(()=>{});await sh.delete()}}catch(e){}
  for(const c of ["cur","snap"]){const q=await fbdb.collection("schools").doc(id).collection(c).get();for(let i=0;i<q.docs.length;i+=400){const b=fbdb.batch();q.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
  let gone=false;const vv=(window.VAULT||{})[id]||{},login=acctId(vv.login||(OSD[id]||{}).email||""),pw=vv.code||"";
  if(login&&pw){try{const au=secApp().auth(),u=(await au.signInWithEmailAndPassword(login,pw)).user;await u.delete();gone=true;try{await au.signOut()}catch(e){}}catch(e){}}
  if(gone)await fbdb.collection("licenses").doc(id).delete().catch(()=>{});else await setStatus(id,"removed");
  await fbdb.collection("vault").doc(id).delete().catch(()=>{});
  await fbdb.collection("directory").doc(id).delete();
  alert(gone?"School delete ho gaya, login bhi hata diya.":"School ka data delete ho gaya aur account band kar diya. Login hamesha ke liye hatane ke liye Firebase Console > Authentication mein is user ko delete karein.");
 }catch(x){alert("Delete poora nahi hua: "+fe(x)+"\nDobara koshish karein.")}
 ownerPanel()};
})();
</script>

<script id="daychange">/* the app stays open past midnight: switch "today" to the new local date */

setInterval(chk,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()})})();

<script id="auditlog">
/* Activity log: who changed what (students, teachers, notices, leaves...), with Undo for the latest changes */
(function(){
const SKIP={__audit:1,__trash:1,logidx:1,msgs:1,qres:1},NAMES={students:"Student",teachers:"Teacher",notices:"Notice",leaves:"Leave",books:"Book",exams:"Exam",quizzes:"Quiz",timetable:"Timetable"};
const KEYN={att:"attendance",att2:"attendance",pay:"fees",ch:"fees",fee:"fees",tg:"marks",grades:"marks"};
const MAXE=150,KEEP=40,MAXP=20000;
let base=null,baseS=null,tm=null,inAudit=false,shown=30;
const nameOf=o=>String(o&&(o.name||o.title||o.text||o.subj||o.kind)||o&&o.id||"").slice(0,40);
function snap(){const m={};Object.keys(S).forEach(k=>{const a=S[k];if(SKIP[k]||!Array.isArray(a))return;const mm={};for(const o of a){if(!o||typeof o!=="object"||typeof o.id!=="string")return;mm[o.id]=JSON.stringify(o)}m[k]=mm});return m}
function dkeys(a,b){try{const x=JSON.parse(a),y=JSON.parse(b),r=[];new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>{if(JSON.stringify(x[k])!==JSON.stringify(y[k])){const n=KEYN[k]||k;if(!r.includes(n))r.push(n)}});return r.slice(0,4)}catch(e){return[]}}
function actor(){try{if(window.SUPSCHOOL)return"Owner (support)";if(me&&me.admin)return"Admin";const t=(S.teachers||[]).find(x=>x.id===me.tid);return t?t.name:"Teacher"}catch(e){return"?"}}
const TDAYS=14,TMAX=300;
function trashAdd(k,rid,n,rec){const t=S.__trash=(S.__trash||[]).filter(x=>Date.now()-x.ts<TDAYS*864e5&&!(x.k===k&&x.rid===rid));t.unshift({id:uid(),ts:Date.now(),by:actor(),k,rid,n,rec});if(t.length>TMAX)t.length=TMAX}
function run(){
 if(window.RO||typeof S==="undefined"||!S||typeof me==="undefined"||!me)return;
 if(!base||S!==baseS){base=snap();baseS=S;return}
 const cur=snap(),ents=[];
 for(const k of Object.keys(cur)){const c=cur[k],b=base[k]||{};
  for(const id in c){if(!(id in b)){let o={};try{o=JSON.parse(c[id])}catch(e){}ents.push({k,rid:id,t:"add",n:nameOf(o)})}
   else if(c[id]!==b[id]){let o={};try{o=JSON.parse(c[id])}catch(e){}const ks=dkeys(b[id],c[id]);ents.push({k,rid:id,t:"chg",n:nameOf(o),keys:ks,prev:b[id].length<=MAXP?b[id]:undefined})}}
  for(const id in b)if(!(id in c)){let o={};try{o=JSON.parse(b[id])}catch(e){}if(b[id].length<=80000)trashAdd(k,id,nameOf(o),b[id]);ents.push({k,rid:id,t:"del",n:nameOf(o),rec:b[id].length<=MAXP?b[id]:undefined})}}
 for(const k of Object.keys(base))if(!(k in cur)&&Array.isArray(S[k])===false){/* collection removed: ignore */}
 base=cur;baseS=S;
 if(!ents.length)return;
 const by=actor(),ts=Date.now();let out;
 if(ents.length>8){const cnt={};ents.forEach(e=>{const n=NAMES[e.k]||e.k;cnt[n]=(cnt[n]||0)+1});out=[{id:uid(),ts,by,t:"bulk",text:ents.length+" records changed: "+Object.keys(cnt).map(n=>cnt[n]+" "+n).join(", ")}]}
 else out=ents.map(e=>Object.assign({id:uid(),ts,by},e));
 S.__audit=out.concat(S.__audit||[]).slice(0,MAXE);
 S.__audit.forEach((e,i)=>{if(i>=KEEP){delete e.prev;delete e.rec}});
 inAudit=true;try{window.__commit0(false)}finally{inAudit=false}
}
const c0=window.commit;window.__commit0=c0;
window.commit=function(){const r=c0.apply(this,arguments);if(!inAudit){clearTimeout(tm);tm=setTimeout(()=>{try{run()}catch(e){}},800)}return r};
function when(ts){return new Date(ts).toLocaleString([],{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}
function text(e){if(e.t==="bulk")return e.text;const w=NAMES[e.k]||e.k;return e.t==="add"?w+" added: "+e.n:e.t==="del"?w+" deleted: "+e.n:w+" changed: "+e.n+(e.keys&&e.keys.length?" ("+e.keys.join(", ")+")":"")}
const canUndo=e=>!e.undone&&((e.t==="del"&&e.rec)||(e.t==="chg"&&e.prev)||e.t==="add");
window.auditMore=function(){shown+=30;render()};
window.auOpen=function(){window._auO=!window._auO;render()};
window.auditCard=function(){
 if(!isAd()||window.RO)return"";const a=S.__audit||[];
 if(!window._auO)return `<button class="ghost" style="width:100%;margin:8px 0" onclick="auOpen()">📜 Activity log (kisne kya badla) · ${a.length}</button>`;
 return `<div class="card"><div class="name">📜 Activity log</div><button class="ghost" style="margin:4px 0" onclick="auOpen()">✕ Band karein</button><p class="stat">Kisne kya badla. Naye badlaw ko ↩ Undo se wapas kar sakte hain.</p>${a.length?a.slice(0,shown).map(e=>`<div style="border-top:1px solid var(--line);padding:6px 0"><div class="stat">${esc(when(e.ts))} · <b>${esc(e.by||"")}</b></div><div>${esc(text(e))}${e.undone?' <span class="stat">(undo ho chuka)</span>':""}</div>${canUndo(e)?`<button class="ghost" onclick="auditUndo('${e.id}')">↩ Undo</button>`:""}</div>`).join("")+(a.length>shown?`<button class="ghost" onclick="auditMore()">Aur dikhayein</button>`:""):'<p class="stat">Abhi koi badlaw nahi.</p>'}</div>`};
window.auditUndo=function(id){const e=(S.__audit||[]).find(x=>x.id===id);if(!e||e.undone||!canUndo(e))return;const arr=S[e.k];if(!Array.isArray(arr))return;
 if(e.t==="del"){if(arr.some(o=>o.id===e.rid)){alert("Ye record pehle se maujood hai.");return}if(!confirm("'"+e.n+"' wapas laayein?"))return;arr.push(JSON.parse(e.rec))}
 else if(e.t==="chg"){const i=arr.findIndex(o=>o.id===e.rid);if(i<0){alert("Ye record ab maujood nahi.");return}if(!confirm("'"+e.n+"' ko purani halat par wapas karein? Is ke baad ke saare badlaw is record se hat jayenge."))return;arr[i]=JSON.parse(e.prev)}
 else if(e.t==="add"){const i=arr.findIndex(o=>o.id===e.rid);if(i<0){alert("Ye record ab maujood nahi.");return}if(!confirm("'"+e.n+"' ko hata dein (is ka add hona undo)?"))return;arr.splice(i,1)}
 e.undone=true;commit()};
window.trashList=()=>(S.__trash||[]).filter(x=>Date.now()-x.ts<TDAYS*864e5);
window.trashBack=function(id){if(!isAd())return;const e=(S.__trash||[]).find(x=>x.id===id);if(!e)return;const arr=S[e.k];if(!Array.isArray(arr)){alert("Ye cheez wapas nahi aa sakti.");return}
 if(arr.some(o=>o.id===e.rid)){alert("Ye pehle se maujood hai.");S.__trash=S.__trash.filter(x=>x.id!==id);commit();return}
 if(!confirm("'"+e.n+"' wapas laayein?"))return;try{arr.push(JSON.parse(e.rec))}catch(x){alert("Record kharab hai, wapas nahi aa saka.");return}
 S.__trash=S.__trash.filter(x=>x.id!==id);commit();toast("Wapas aa gaya.")};
window.trashGone=function(id){if(!isAd())return;if(!confirm("Hamesha ke liye hata dein? Ye wapas nahi aayega."))return;S.__trash=(S.__trash||[]).filter(x=>x.id!==id);commit()};
