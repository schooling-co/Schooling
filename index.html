<style>

:root[data-pal="forest"]{--g1:#10b981;--g2:#0f766e}
:root[data-pal="sunset"]{--g1:#f97316;--g2:#ec4899}
:root[data-pal="rose"]{--g1:#e11d48;--g2:#f472b6}
:root[data-pal="teal"]{--g1:#0d9488;--g2:#06b6d4}
:root[data-pal="gold"]{--g1:#d97706;--g2:#f59e0b}
:root[data-pal="royal"]{--g1:#1d4ed8;--g2:#7c3aed}
:root[data-pal="berry"]{--g1:#9d174d;--g2:#7e22ce}
:root[data-pal="lime"]{--g1:#65a30d;--g2:#16a34a}
:root[data-pal="coral"]{--g1:#ef4444;--g2:#f97316}
:root[data-pal="slate"]{--g1:#475569;--g2:#1e293b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12112a;--card:#1c1b3a;--ink:#ecebff;--mut:#a4a3c8;--line:#302f57;--sh:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#12112a;--card:#1c1b3a;--ink:#ecebff;--mut:#a4a3c8;--line:#302f57;--sh:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--ink);font:1rem/1.45 "Nunito",system-ui,sans-serif;max-width:640px;padding:0 16px 100px}
h1,.name,.big,.btn{font-family:"Fredoka","Nunito",system-ui,sans-serif}
.hero{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:0 0 28px 28px;margin:0 -16px 16px;padding:30px 20px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--sh)}
.hero h1{font-size:1.65rem;margin:0;font-weight:600}
.hero .sub{color:rgba(255,255,255,.88);margin:2px 0 0}
.crest{font-size:1.9rem;background:rgba(255,255,255,.22);width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.getapp{position:absolute;top:6px;right:12px;background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:999px;padding:3px 12px;min-height:24px;font-size:.75rem;font-weight:800;cursor:pointer}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.name{font-weight:600}
.av img{width:100%;height:100%;object-fit:cover}
.avl{position:relative;cursor:pointer;display:inline-block;line-height:0}
.avl::after{content:"📷";position:absolute;right:-6px;bottom:-4px;font-size:.7rem;background:var(--card);border-radius:50%;padding:2px;line-height:1}
.stu{display:flex;align-items:center;gap:10px}
.av{overflow:hidden;width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;min-height:46px;width:100%}
.add{display:flex;gap:8px;margin-bottom:12px}
.add input{flex:1}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;border-radius:12px;padding:0 18px;min-height:46px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px rgba(80,60,200,.25)}
.ghost{border:0;background:none;color:var(--acc);font-weight:700;cursor:pointer;min-height:40px}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line);background:none;border-radius:14px;padding:6px 2px;min-height:52px;cursor:pointer;font-weight:700}
.seg b{font-family:"Fredoka",sans-serif;font-size:1.3rem;line-height:1.1}
.seg small{font-size:.78rem;font-weight:800;color:var(--mut)}
.seg .P b{color:var(--P)}.seg .A b{color:var(--A)}.seg .L b{color:var(--L)}.seg .T b{color:var(--T)}
.seg .P.on{background:var(--P);border-color:var(--P)}.seg .A.on{background:var(--A);border-color:var(--A)}.seg .L.on{background:var(--L);border-color:var(--L)}.seg .T.on{background:var(--T);border-color:var(--T)}
.seg .on b,.seg .on small{color:#fff}
.sws{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.sw{border:2px solid var(--line);background:none;border-radius:14px;padding:6px 2px;cursor:pointer;font-size:.72rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.sw i{width:34px;height:34px;border-radius:50%;display:block}
.sw.on{border-color:var(--acc)}
.seg .pick{font-size:.9rem}
.seg .pick.on{background:var(--acc);border-color:var(--acc);color:#fff}
.cnts{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px;margin-bottom:12px}
.cnt{border-radius:14px;padding:8px 2px;text-align:center;color:#fff;background:var(--mut)}
.cnt b{display:block;font-family:"Fredoka",sans-serif;font-size:1.35rem;line-height:1.1}.cnt span{font-size:.66rem;font-weight:800}
.cnt.P,.pill.P,.dot.P{background:var(--P)}.cnt.A,.pill.A,.dot.A{background:var(--A)}.cnt.L,.pill.L,.dot.L{background:var(--L)}.cnt.T,.pill.T,.dot.T{background:var(--T)}
.pill{font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff;background:var(--mut)}
.dc{display:inline-flex;flex-direction:column;align-items:center;margin:2px 4px 2px 0}.dc small{font-size:.65rem;color:var(--mut)}
.dot{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800}
.seg .P{border-color:color-mix(in srgb,var(--P) 50%,var(--line))}.seg .A{border-color:color-mix(in srgb,var(--A) 50%,var(--line))}.seg .L{border-color:color-mix(in srgb,var(--L) 50%,var(--line))}.seg .T{border-color:color-mix(in srgb,var(--T) 50%,var(--line))}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;font-weight:800;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem}
.qa span{font-size:1.5rem}
.dashbtn{margin-top:10px;background:rgba(255,255,255,.24);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;font-family:inherit}
.lnk{flex:1;text-align:center;border:2px solid var(--line);border-radius:14px;padding:10px 4px;font-weight:800;color:var(--ink);text-decoration:none;min-height:46px;display:grid;place-items:center}
.due{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border-radius:16px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;box-shadow:var(--sh)}
.due button{background:#fff;color:#b45309;border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;flex:none}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lg{font-size:.8rem;padding:3px 10px;border-radius:999px;color:#fff;font-weight:800}
.lg.P{background:var(--P)}.lg.A{background:var(--A)}.lg.L{background:var(--L)}.lg.T{background:var(--T)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{border-radius:20px;padding:14px;color:#fff;box-shadow:var(--sh)}
.tile .big{color:#fff;font-size:1.5rem}.tile .stat{color:rgba(255,255,255,.92)}.tile .em{font-size:1.4rem}
.t1{background:linear-gradient(135deg,var(--g1),var(--g2))}.t2{background:linear-gradient(135deg,#16a34a,#4ade80)}.t3{background:linear-gradient(135deg,#e11d48,#fb7185)}.t4{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
nav{overflow-x:auto;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(60,40,140,.12);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:0 0 auto;min-width:74px;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:6px 8px;border-radius:14px;font-weight:700;color:var(--mut);cursor:pointer;font-size:.72rem}
nav button .ic{font-size:1.3rem}
nav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.grid{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:8px}
.big{font-weight:600;font-size:1.2rem}
.msg{padding:9px 12px;border-radius:16px;margin-bottom:6px;max-width:85%}
.msg.t{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;margin-left:auto}
.msg.p{background:var(--line)}
.stat{color:var(--mut);font-size:.9rem}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.tag{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--mut);font-weight:700}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
<style>body{-webkit-font-smoothing:antialiased;letter-spacing:.005em}.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-1px)}.btn:active,.ghost:active{transform:scale(.97)}.hero h1{letter-spacing:.01em;text-shadow:0 2px 8px rgba(0,0,0,.18)}input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(109,94,252,.35);outline-offset:1px}#nav,nav{backdrop-filter:blur(10px)}::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}</style>
<style id="v11head">
#splash{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0f0e24;color:#fff;overflow:hidden;transition:opacity .6s ease,scale .6s ease;touch-action:none;animation:spkill .01s 4.5s forwards}

.sp-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
.sp-lw{position:relative;width:150px;height:140px;display:grid;place-items:center}
.sp-lw::before{content:"";position:absolute;inset:-28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);animation:spring 1.5s .15s ease-out both}

@keyframes spring{from{scale:.3;opacity:0}40%{opacity:1}to{scale:1.2;opacity:0}}

.sp-logo{width:150px;height:140px;overflow:visible;position:relative;z-index:1;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}

@keyframes spbook{from{opacity:0;transform:translateY(26px) scaleY(.4)}to{opacity:1;transform:none}}
.sp-cap{transform-box:fill-box;transform-origin:50% 50%;animation:spcap .9s .5s cubic-bezier(.3,1.4,.5,1) both}
.sp-tas{transform-box:fill-box;transform-origin:50% 0;animation:spcap .9s .5s cubic-bezier(.3,1.4,.5,1) both,sptas 1.6s 1.5s ease-in-out infinite}
@keyframes spcap{from{opacity:0;transform:translateY(-64px) rotate(-14deg) scale(.8)}to{opacity:1;transform:none}}
@keyframes sptas{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
.spn{display:flex;font:600 1.95rem "Fredoka","Nunito",system-ui,sans-serif;letter-spacing:.02em;min-height:2.4rem}
.spn span{display:inline-block;opacity:0;animation:spl .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes spl{from{opacity:0;transform:translateY(22px) scale(.6)}to{opacity:1;transform:none}}
.spt{font:700 .72rem system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;opacity:0;color:rgba(255,255,255,.75);animation:spf .8s 1.6s ease both}
@keyframes spf{from{opacity:0;transform:translateY(8px)}to{opacity:.9;transform:none}}
.spbar{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:120px;height:3px;border-radius:9px;background:rgba(255,255,255,.14);translate:-50% 0;overflow:hidden}
.spbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#fb2f7d);transform-origin:0 50%;animation:spb 2.1s .1s cubic-bezier(.4,0,.2,1) both}
@keyframes spb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#splash *,#splash::before{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

async function osAdd(){if(!isOwner())return;const m=$("gm"),name=$("os_name").value.trim(),lg=acctId($("os_login").value),pw=$("os_pw").value,mo=+$("os_mo").value;if(!name||!lg.includes("@")){m.textContent="School name aur sahi email ya mobile number likhein.";return}if(pw.length<6){m.textContent="Password must be at least 6 characters.";return}m.textContent="Creating...";let au;try{au=secApp().auth();const cr=await au.createUserWithEmailAndPassword(lg,pw),uid=cr.user.uid;await au.signOut();await fbdb.collection("directory").doc(uid).set({email:acctShow(lg),name,created:firebase.firestore.FieldValue.serverTimestamp(),by:"owner"});await fbdb.collection("licenses").doc(uid).set({status:"active",until:mo>0?Date.now()+mo*30*864e5:0,ts:Date.now()});ownerPanel()}catch(x){try{au&&await au.signOut()}catch(y){}m.textContent=fe(x)}}

// ---- login code, firebase setup wizard, storage quota
const RULES_TXT=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function mine(u) { return signedIn() && request.auth.uid == u; }
    function owner() { return signedIn() && request.auth.uid == 'PASTE_OWNER_UID_HERE'; }
    function blocked(u) {
      return exists(/databases/$(database)/documents/licenses/$(u))
        && get(/databases/$(database)/documents/licenses/$(u)).data.status in ['suspended', 'removed'];
    }
    function paid(u) {
      return exists(/databases/$(database)/documents/licenses/$(u))
        && get(/databases/$(database)/documents/licenses/$(u)).data.until > request.time.toMillis();
    }
    function trial(u) {
      return get(/databases/$(database)/documents/directory/$(u)).data.created + duration.value(3, 'd') > request.time;
    }
    // school data: only its own account, and only while paid or in trial
    match /schools/{u}/{document=**} {
      allow read, write: if owner();
      allow read, write: if mine(u) && !blocked(u) && (paid(u) || trial(u));
    }
    // school profile + payment request (school writes, cannot change 'created')
    match /directory/{u} {
      allow read: if mine(u) || owner();
      // no self-create: only the owner can add an account (owner write rule below)
      allow update: if mine(u) && request.resource.data.created == resource.data.created;
      allow write: if owner();
    }
    // licences: only the owner can write
    match /licenses/{u} {
      allow read: if mine(u) || owner();
      allow write: if owner();
    }
  }
}

(function(){
const SUPER_HASH=0;
const h53=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return 4294967296*(2097151&b)+(a>>>0)};
window.supHash=h53;window.supCheck=c=>h53(String(c||"").trim())===((S&&S.superH)||SUPER_HASH);let SUP=false,pg="sa";window.isSuper=()=>SUP&&!!me&&!!me.sup;const noSup=()=>{alert("Ye kaam aap nahi kar sakte.");return};
const ok0=()=>{S.attLog=S.attLog||[];S.conf=S.conf||{};S.inv=S.inv||{}};

["ownerReset","setCred","unlink","saveOwner"].forEach(guard);

// ---- login tab for super admin
const olt=window.loginTabs;window.loginTabs=function(){return olt().replace(/<\/div>$/,`<button style="flex:1;padding:10px 4px;border-radius:999px;border:2px solid var(--line);font-weight:700;background:${ltab==="sup"?"var(--acc)":"var(--card)"};color:${ltab==="sup"?"#fff":"var(--ink)"}" onclick="ltab='sup';render()">👑</button></div>`)};

return `<div class="seg"><a class="lnk" href="${esc(sm(s,d))}" ${k}>💬 SMS</a><a class="lnk" href="${esc(wa(s,d))}" target="_blank" ${k}>🟢 WhatsApp</a></div>${c?`<span class="v2b" style="background:${c.v?"var(--P)":"var(--A)"}">${c.v?"✅ Parent confirmed":"❌ Not confirmed"}</span>`:S.sent[d+"|"+s.id]?'<span class="tag ok">Sent</span>':""}`};
